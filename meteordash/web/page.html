<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>meteor · command deck</title>
<style>
:root{
 --void:#0b0906; --panel:#17130d; --panel2:#211a11; --edge:#3a2f1e; --edgehi:#5a4a30;
 --amber:#ff9b21; --amber2:#c9761a; --cyan:#35d6d6;
 --ok:#7ac74f; --warn:#ffbe2e; --crit:#ff3d3d; --info:#35d6d6;
 --txt:#efe6d2; --dim:#9a8b70; --faint:#6a5d47;
 --mono:"DejaVu Sans Mono","Liberation Mono","Consolas",monospace;
 --sans:"DejaVu Sans","Liberation Sans",system-ui,sans-serif;
 --cut:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--edge) var(--void)}
body{background:var(--void);color:var(--txt);font-family:var(--sans);font-size:14px;
 line-height:1.5;padding:22px clamp(14px,3vw,40px) 60px;max-width:1240px;margin:0 auto;
 background-image:linear-gradient(rgba(255,155,33,.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,155,33,.025) 1px,transparent 1px);
 background-size:44px 44px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.35}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
 border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:20px}
.brand{font-weight:800;letter-spacing:3px;text-transform:uppercase;font-size:22px}
.brand b{color:var(--amber)}
.brand i{color:var(--faint);font-style:normal;font-weight:400;font-size:12px;letter-spacing:2px}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;
 padding:4px 10px;border:1px solid var(--edge);color:var(--dim);background:var(--panel);
 display:flex;gap:6px;align-items:center}
.chip b{color:var(--txt);font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);box-shadow:0 0 6px currentColor}
.dot.on{background:var(--ok);color:var(--ok)} .dot.off{background:var(--crit);color:var(--crit)}
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
 background:var(--edge);border:1px solid var(--edge);margin-bottom:24px}
.rail>div{background:var(--panel);padding:12px 16px}
.rail .lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
.rail .val{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--amber);margin-top:2px;line-height:1}
.rail .val small{font-size:13px;color:var(--dim);font-weight:400}
.rail .val.cy{color:var(--cyan)} .rail .val.tx{color:var(--txt)}
.zone{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
.zone i{width:9px;height:9px;background:var(--amber);transform:rotate(45deg);flex:none}
.zone h2{font-weight:800;letter-spacing:3px;text-transform:uppercase;font-size:13px;color:var(--txt)}
.zone span{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:1px}
.zone hr{flex:1;border:none;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.panel{position:relative;background:var(--edge);padding:1px;
 clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.panel>.in{background:linear-gradient(160deg,var(--panel2),var(--panel));padding:14px 16px 16px;height:100%;
 clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.phd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.phd .tk{width:5px;height:14px;background:var(--amber);flex:none}
.phd h3{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.phd .tag{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;
 color:var(--amber);border:1px solid var(--edgehi);padding:2px 7px}
.phd .tag.cy{color:var(--cyan)} .phd .tag.off{color:var(--faint)}
.gauges{display:flex;gap:8px;justify-content:space-around;flex-wrap:wrap}
.gau{text-align:center;flex:1;min-width:96px}
.gau svg{display:block;margin:0 auto}
.gau .cap{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:6px}
.gau .cap b{color:var(--txt)}
.ro{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
 border-bottom:1px solid rgba(90,74,48,.25);font-size:13px}
.ro:last-child{border-bottom:none}
.ro .k{color:var(--dim)} .ro .v{font-family:var(--mono);color:var(--txt);font-weight:700}
.bar{height:8px;background:#0f0c08;border:1px solid var(--edge);position:relative;overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;background:var(--amber);transition:width .5s ease}
.bar.cy>i{background:var(--cyan)}
.seg{height:10px;display:flex;gap:2px;margin-top:7px}
.seg>i{flex:1;background:#0f0c08;border:1px solid var(--edge)}
.seg>i.f{background:var(--amber);border-color:var(--amber2)}
.tank{margin:9px 0}
.tank .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.tank .top .nm{color:var(--txt);font-weight:600}
.tank .top .nm em{color:var(--faint);font-style:normal;font-family:var(--mono);font-size:11px;margin-left:6px}
.tank .top .sz{font-family:var(--mono);color:var(--amber);font-weight:700}
.slot{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#0f0c08;border:1px solid var(--edge);margin-bottom:7px}
.slot .led{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 7px currentColor}
.slot .nm{font-weight:600;color:var(--txt)} .slot .nm em{color:var(--faint);font-style:normal;font-size:11px;margin-left:7px;font-family:var(--mono)}
.slot .sz{margin-left:auto;font-family:var(--mono);color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--faint);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:5px 8px;border-bottom:1px solid var(--edge);font-weight:700}
td{padding:6px 8px;border-bottom:1px solid rgba(90,74,48,.2);color:var(--dim)}
td:first-child{color:var(--txt)}
tr:hover td{background:rgba(255,155,33,.04)}
.tw{overflow-x:auto}
.amber{color:var(--amber)} .cy{color:var(--cyan)}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--edge);font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:1px;display:flex;gap:16px;flex-wrap:wrap}
.miss{color:var(--faint);font-size:12px;padding:10px 0}
.alert{display:flex;gap:12px;padding:11px 13px;background:#0f0c08;border-left:3px solid var(--warn);margin-bottom:9px}
.alert.crit{border-color:var(--crit)} .alert.info{border-color:var(--cyan)}
.alert .big{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--warn);line-height:1;white-space:nowrap}
.alert.crit .big{color:var(--crit)} .alert.info .big{color:var(--cyan)}
.alert .tx{font-size:12.5px;color:var(--dim);line-height:1.4}
.alert .tx b{color:var(--txt)}
.up{color:var(--ok)} .down{color:var(--crit)} .flat{color:var(--faint)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1px;background:var(--edge);border:1px solid var(--edge)}
.hrow{background:var(--panel);display:flex;align-items:center;gap:11px;padding:11px 14px}
.hrow .sig{width:10px;height:10px;flex:none;transform:rotate(45deg);box-shadow:0 0 7px currentColor}
.hrow.ok .sig{background:var(--ok);color:var(--ok)} .hrow.warn .sig{background:var(--warn);color:var(--warn)}
.hrow.info .sig{background:var(--info);color:var(--info)}
.hrow.crit .sig{background:var(--crit);color:var(--crit);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.35}}
.hrow .nm{font-weight:700;color:var(--txt);font-size:13px;white-space:nowrap}
.hrow .dt{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:auto;text-align:right}
.hrow.crit .dt{color:var(--crit)} .hrow.warn .dt{color:var(--warn)}
.hbanner{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--edge);padding:10px 16px;margin-bottom:1px;font-family:var(--mono);font-size:12px;letter-spacing:1px}
.hbanner .st{font-weight:700;text-transform:uppercase;letter-spacing:2px}
.hbanner.ok .st{color:var(--ok)} .hbanner.warn .st{color:var(--warn)} .hbanner.crit .st{color:var(--crit)}
.hbanner .cnt{color:var(--dim);margin-left:auto}
.mv{display:flex;align-items:center;gap:10px;padding:7px 9px;border-bottom:1px solid rgba(90,74,48,.2);font-size:12.5px}
.mv .st{width:8px;height:8px;border-radius:50%;flex:none}
.mv .st.w{background:var(--ok);box-shadow:0 0 6px var(--ok)} .mv .st.u{background:var(--faint)}
.mv .nm{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .how{font-family:var(--mono);font-size:9px;color:var(--faint);text-transform:uppercase}
.mv .sz{margin-left:auto;font-family:var(--mono);color:var(--dim);flex:none}
.mv button{flex:none;background:#0f0c08;border:1px solid var(--edgehi);color:var(--amber);
 font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:3px 8px;cursor:pointer}
.mv button:hover{background:var(--amber);color:var(--void)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<script>window.__BOOT__=__BOOTJSON__;</script>
<header>
 <div class=brand><b>METEOR</b>·DASH <i id=host></i></div>
 <div class=chips>
  <div class=chip><span class=dot id=vpnd></span> <span id=vpn>NET</span></div>
  <div class=chip id=profchip style=display:none>PROFILE <b id=prof>—</b></div>
  <div class=chip>GOV <b id=gov>—</b></div>
  <div class=chip mono id=clock>--:--:--</div>
 </div>
</header>
<div class=rail id=rail></div>
<div id=zones></div>
<div class=foot><span>METEOR-DASH</span><span id=cfgline></span><span>localhost telemetry</span></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>(s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(s){s=esc(s);
 s=s.replace(/\[\[([^\]]+)\]\]/g,(m,x)=>x.split('/').pop());
 s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
 s=s.replace(/`([^`]+)`/g,'<span class=mono>$1</span>');
 return s;}
function toB(s){if(!s)return 0;const m=(''+s).match(/([\d.]+)\s*([KMGT])?/i);if(!m)return 0;
 const u={K:1e3,M:1e6,G:1e9,T:1e12}[(m[2]||'').toUpperCase()]||1;return parseFloat(m[1])*u;}
let CFG={panels:{},thresholds:{}};
const th=n=>{const t=CFG.thresholds[n]||{};return [t.warn,t.crit];};
function human(n){if(n==null)return'—';for(const u of['B','K','M','G','T']){if(n<1024)return (u=='B'?n.toFixed(0):n.toFixed(1))+u;n/=1024;}return n.toFixed(1)+'P';}
const clr=(v,a,b)=>v==null?'var(--amber)':(b!=null&&v>=b)?'var(--crit)':(a!=null&&v>=a)?'var(--warn)':'var(--amber)';
function gauge(val,max,unit,cap,warn,crit,size){
 size=size||110;const c=size/2,R=size*0.38,C=2*Math.PI*R,w=size*0.084;
 const pct=val==null?0:Math.min(val/max,1),col=clr(val,warn,crit),rot=135;
 return `<div class=gau><svg width=${size} height=${size} viewBox="0 0 ${size} ${size}">
  <circle cx=${c} cy=${c} r=${R} fill=none stroke="#0f0c08" stroke-width=${w} stroke-dasharray="${C*.75} ${C}" transform="rotate(${rot} ${c} ${c})"></circle>
  <circle cx=${c} cy=${c} r=${R} fill=none stroke="${col}" stroke-width=${w} stroke-dasharray="${C*.75*pct} ${C}" transform="rotate(${rot} ${c} ${c})" style="filter:drop-shadow(0 0 5px ${col});transition:stroke-dasharray .6s,stroke .6s"></circle>
  <text x=${c} y=${c+size*0.02} text-anchor=middle style="font-family:var(--mono);font-size:${size*0.23}px;font-weight:700;fill:var(--txt)">${val==null?'—':val}</text>
  <text x=${c} y=${c+size*0.14} text-anchor=middle style="font-family:var(--mono);font-size:${size*0.08}px;fill:var(--dim)">${unit}</text>
 </svg><div class=cap>${cap}</div></div>`;
}
const panel=(title,tag,tagcls,body)=>`<div class=panel><div class=in>
 <div class=phd><div class=tk></div><h3>${esc(title)}</h3>${tag?`<div class="tag ${tagcls||''}">${esc(tag)}</div>`:''}</div>${body}</div></div>`;
const ro=(k,v)=>`<div class=ro><span class=k>${k}</span><span class=v>${v}</span></div>`;
const bar=(v,cy)=>`<div class="bar${cy?' cy':''}"><i style="width:${Math.min(v||0,100)}%"></i></div>`;
const seg=v=>{let h='<div class=seg>';for(let k=0;k<10;k++)h+=`<i class="${(v/10)>k?'f':''}"></i>`;return h+'</div>';}
const zone=(t,s)=>`<div class=zone><i></i><h2>${t}</h2><span>${s||''}</span><hr></div>`;

// ---------------- telemetry ----------------
function telemetry(d){
 const [ctw,ctc]=th('cpu_temp'),[clw,clc]=th('cpu_load'),[mw,mc]=th('mem_pct');
 let cards='';
 if(CFG.panels.cpu){const c=d.cpu||{};
  cards+=panel('Reactor Core'+(c.model?' · '+c.model.replace(/AMD |Intel\(R\) Core\(TM\) /,'').split(' with')[0]:''),c.governor,'',
   `<div class=gauges>${gauge(c.temp,100,'°C','CPU',ctw,ctc)}${gauge(c.usage,100,'%','LOAD',clw,clc)}</div>
    ${ro('Clock',(c.ghz??'—')+' GHz')}${ro('Cores',c.cores??'—')}`);}
 if(CFG.panels.gpu)(d.gpus||[]).forEach(g=>{const [gw,gc]=th('gpu_temp'),[glw,glc]=th('gpu_load');
  const active=g.util>0;
  cards+=panel(g.name+' · '+g.vendor.toUpperCase(),active?'ACTIVE':'IDLE',active?'':'off',
   `<div class=gauges>${gauge(g.temp,100,'°C','GPU',gw,gc)}${g.util!=null?gauge(g.util,100,'%','USAGE',glw,glc):''}</div>
    ${g.watt!=null?ro('Power',g.watt+' W'):''}
    ${g.vram!=null?ro('VRAM',g.vram+' / '+g.vram_total+' MB'):''}`);});
 if(CFG.panels.fans&&(d.fans||[]).length){
  cards+=panel('Cooling',d.profile||'',' ',(d.fans.map(f=>ro(esc(f.label),f.rpm+' <small style=color:var(--dim)>rpm</small>')).join('')));}
 if(CFG.panels.memory){const m=d.memory||{};
  cards+=panel('Memory · '+(m.total?Math.round(m.total)+' GB':''),m.pct!=null?m.pct+'%':'','cy',
   ro('In use',(m.used??'—')+' / '+(m.total??'—')+' GB')+bar(m.pct,1)
   +(m.swap_total?ro('Swap',(m.swap_used)+' / '+(m.swap_total)+' GB'):''));}
 if(CFG.panels.battery&&d.battery){const b=d.battery;const [bw,bc]=th('battery_health');
  cards+=panel('Battery'+(b.device?' · '+b.device:''),b.status||'','',
   ro('Charge',(b.pct??'—')+'%')+seg(b.pct)
   +(b.limit?ro('Cap limit',b.limit+'%'):'')
   +(b.health!=null?`<div class=ro><span class=k>Health</span><span class=v style="color:${b.health<=bw?'var(--warn)':'var(--txt)'}">${b.health}%</span></div>`:'')
   +(b.cycles?ro('Cycles',b.cycles):''));}
 return zone('System Telemetry','live · 2s')+`<div class="grid g3">${cards}</div>`;
}

// ---------------- integrity + advisories ----------------
function checklist(title,sub,obj){
 const s=obj.summary||{};const worst=s.crit?'crit':s.warn?'warn':s.info&&!s.ok?'info':'ok';
 const msg={ok:'All systems nominal',warn:'Attention needed',crit:'Action required',info:'Review'}[worst];
 const items=obj.checks||obj.items||[];
 const rows=items.map(c=>`<div class="hrow ${c.state}"><span class=sig></span><span class=nm>${esc(c.name)}</span><span class=dt>${esc(c.detail)}</span></div>`).join('');
 return zone(title,sub)+`<div class="hbanner ${worst}"><span class=st>${msg}</span>
   <span class=cnt>${s.ok||0} ok · ${s.warn||0} warn · ${s.crit||0} crit${s.info?' · '+s.info+' info':''}</span></div>
   <div class=hgrid>${rows}</div>`;
}

// ---------------- vault ----------------
function vaultZone(v){
 if(!v||!v.ok)return zone('Storage Ops','')+'<div class=miss>vault module: no data (check [vault] config)</div>';
 if(v.source==='markdown')return zone('Storage Ops','synced '+(v.updated||''))+markdownVault(v);
 const f=v.folders||[];const max=Math.max(1,...f.map(x=>x.bytes));
 const tanks=f.map(x=>`<div class=tank><div class=top><span class=nm>${esc(x.label)}<em>${x.files} files</em></span><span class=sz>${x.size}</span></div>${bar(x.bytes/max*100)}</div>`).join('');
 const disk=v.disk?panel('Disk',v.disk.pct+'% used','cy',
   `<div style="font-family:var(--mono);font-size:30px;font-weight:700;color:var(--cyan);line-height:1;margin-bottom:8px">${v.disk.free}<small style="font-size:13px;color:var(--dim)"> free</small></div>
    ${ro('Total',v.disk.total)}<div class=bar style=height:14px><i style="width:${v.disk.pct}%;background:var(--cyan)"></i></div>`):'';
 const proj=f.find(x=>x.kind==='projects');
 let pslots='';
 if(proj&&proj.children)pslots=panel('Projects',(proj.children.length)+' tracked','',
   proj.children.map(c=>`<div class=slot><span class=led style="background:${c.fresh?'var(--ok)':'var(--warn)'};color:${c.fresh?'var(--ok)':'var(--warn)'}"></span><span class=nm>${esc(c.name)}${c.stack?'<em>'+esc(c.stack)+'</em>':''}</span><span class=sz>${c.size}</span></div>`).join(''));
 return zone('Storage Ops','live')+`<div class="grid g2">${disk}${panel('Storage Volumes','by size','off',tanks)}</div>`+(pslots?`<div style=margin-top:14px>${pslots}</div>`:'');
}
function markdownVault(v){ // bespoke render of known section types (falls back to tables)
 const S=v.sections||[];
 const sec=t=>S.find(s=>s.title.toLowerCase().startsWith(t.toLowerCase()));
 const table=t=>(t&&t.blocks||[]).find(b=>b.t==='table');
 const texts=t=>(t&&t.blocks||[]).filter(b=>b.t==='p').map(b=>b.text);
 const rendered=new Set();
 const H=[];

 // DISK reservoir hero + storage tanks
 const disk=sec('Disk'); const dtext=texts(disk)[0]||'';
 const dm=dtext.match(/\*\*(\d+)%\*\*[^\d]*([\d.]+\w)\s*of\s*([\d.]+\w)[^\d]*\*\*([\d.]+\w)\s*free/i);
 const fsz=table(sec('Folder Sizes'));
 let tanks='',biggest=null;
 if(fsz){const max=Math.max(...fsz.rows.map(r=>toB(r[1])));
  fsz.rows.sort((a,b)=>toB(b[1])-toB(a[1]));biggest=fsz.rows[0];
  fsz.rows.forEach(r=>{const w=Math.max(toB(r[1])/max*100,1.5);
   tanks+=`<div class=tank><div class=top><span class=nm>${md(r[0])}<em>${r[2]||''} files</em></span><span class=sz>${r[1]}</span></div><div class=bar><i style="width:${w}%"></i></div></div>`;});}
 if(disk||fsz){rendered.add(disk).add(sec('Folder Sizes'));
  const dgau=dm?gauge(parseInt(dm[1]),100,'%','CAPACITY',80,92,168):'';
  H.push(`<div class="grid g2">
   <div class=panel><div class=in>
    <div class=phd><div class=tk></div><h3>Disk Reservoir</h3>${dm?`<div class="tag cy">${dm[1]}% used</div>`:''}</div>
    ${dm?`<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:4px 0 6px">
     <div>${dgau}</div>
     <div style="flex:1;min-width:150px">
      <div style="font-family:var(--mono);font-size:32px;font-weight:700;color:var(--cyan);line-height:1;margin-bottom:8px">${dm[4]}<small style="font-size:13px;color:var(--dim)"> free</small></div>
      <div class=ro><span class=k>Used</span><span class=v>${dm[2]}</span></div>
      <div class=ro><span class=k>Total</span><span class=v>${dm[3]}</span></div>
      ${biggest?`<div class=ro><span class=k>Largest</span><span class=v>${md(biggest[0])} · ${biggest[1]}</span></div>`:''}
     </div></div>
    <div class=bar style="height:16px"><i style="width:${dm[1]}%;background:var(--cyan)"></i></div>`:md(dtext)}
   </div></div>
   <div class=panel><div class=in>
    <div class=phd><div class=tk></div><h3>Storage Volumes</h3><div class="tag off">by size</div></div>
    ${tanks||'<div class=miss>—</div>'}
   </div></div></div>`);}

 // ADVICE alerts
 const advS=sec('Advice')||sec('Advisories'); const adv=texts(advS);
 if(adv.length){rendered.add(advS);let a='';adv.forEach(t=>{
   const big=(t.match(/\*\*([\d.]+[KMGT]|\d+)\*\*/)||[])[1]||(t.match(/^\d+\./)?'!':'·');
   const crit=/duplicate|waste|\bdrop\b/i.test(t);
   a+=`<div class="alert ${crit?'crit':''}"><div class=big>${big}</div><div class=tx>${md(t.replace(/^\d+\.\s*/,''))}</div></div>`;});
  H.push(`<div class=panel style="margin-top:14px"><div class=in>
   <div class=phd><div class=tk></div><h3>Advisories</h3><div class=tag>${adv.length}</div></div>${a}</div></div>`);}

 // PROJECTS slots + STUDIES
 const pjS=sec('Projects'),stuS=sec('Studies');const pj=table(pjS),stu=table(stuS);
 if(pj||stu){rendered.add(pjS).add(stuS);let pslots='';
  if(pj)pj.rows.forEach(r=>{const st=r[1]||'';const col=st.includes('🟢')?'var(--ok)':st.includes('🟡')?'var(--warn)':'var(--faint)';
   pslots+=`<div class=slot><span class=led style="background:${col};color:${col}"></span><span class=nm>${md(r[0])}${r[2]&&r[2]!=='—'?'<em>'+esc(r[2])+'</em>':''}</span><span class=sz>${r[3]||''}</span></div>`;});
  let strows='';if(stu)stu.rows.forEach(r=>{strows+=`<tr><td>${md(r[0])}</td><td class=amber>${r[1]||''}</td><td>${r[2]||''}</td></tr>`;});
  H.push(`<div class="grid g2" style="margin-top:14px">
   <div class=panel><div class=in><div class=phd><div class=tk></div><h3>Projects</h3><div class=tag>${pj?pj.rows.length:0} live</div></div>${pslots||'<div class=miss>—</div>'}</div></div>
   <div class=panel><div class=in><div class=phd><div class=tk></div><h3>Studies</h3></div><div class=tw><table><thead><tr><th>Area</th><th>Size</th><th>Modified</th></tr></thead><tbody>${strows}</tbody></table></div></div></div></div>`);}

 // MOVIE backlog + RECLAIMABLE
 const mvS=sec('Movies'),dupS=sec('Duplicates'),dlS=sec('Downloads'),stgS=sec('Staging');
 const mt=table(mvS),mtxt=texts(mvS)[0]||'';
 const wm=mtxt.match(/\*\*(\d+)\/(\d+)\*\*.*?\*\*([\d.]+\w)\*\*/);
 let mrows='';if(mt)mt.rows.slice(0,7).forEach(r=>{mrows+=`<tr><td>${esc(r[0]).slice(0,42)}</td><td class=amber>${r[1]||''}</td><td>${r[2]||''}</td></tr>`;});
 const dup=texts(dupS)[0]||'';const dupm=dup.match(/\*\*(\d+)\s*groups\*\*,\s*([\d.]+\w)/i);const duptbl=table(dupS);
 const dl=table(dlS);let stale='';if(dl){const sr=dl.rows.find(r=>/stale/i.test(r[0]));stale=sr?sr[1]:'';}
 const stg=texts(stgS)[0]||'';const stgm=stg.match(/\*\*([\d.]+\w)\*\*,\s*(\d+)/);
 if(mt||dupm||stale||stgm){rendered.add(mvS).add(dupS).add(dlS).add(stgS);
  H.push(`<div class="grid g2" style="margin-top:14px">
   <div class=panel><div class=in>
    <div class=phd><div class=tk></div><h3>Movie Backlog</h3>${wm?`<div class=tag>${wm[1]}/${wm[2]} seen</div>`:''}</div>
    ${wm?`<div class=alert info><div class=big>${wm[3]}</div><div class=tx><b>Unwatched backlog.</b> ${wm[1]} of ${wm[2]} titles watched.</div></div>`:''}
    <div class=tw><table><thead><tr><th>Unwatched</th><th>Size</th><th>Age</th></tr></thead><tbody>${mrows}</tbody></table></div></div></div>
   <div class=panel><div class=in>
    <div class=phd><div class=tk></div><h3>Reclaimable</h3><div class="tag off">cleanup</div></div>
    ${dupm?`<div class="alert crit"><div class=big>${dupm[2]}</div><div class=tx><b>${dupm[1]} duplicate groups.</b> Reclaimable space.</div></div>`:''}
    ${stale?`<div class=alert><div class=big>${stale.split(',')[0]}</div><div class=tx><b>Stale downloads</b> (90+ days). Triage.</div></div>`:''}
    ${stgm?`<div class="alert info"><div class=big>${stgm[1]}</div><div class=tx><b>${stgm[2]} items staged</b>. Empty when ready.</div></div>`:''}
    ${duptbl?`<div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:12px 0 4px">Top duplicate files</div><div class=tw><table><tbody>${duptbl.rows.slice(0,3).map(r=>`<tr><td>${esc(r[0])}</td><td class=amber style="text-align:right">${r[1]||''}</td><td style="text-align:right">×${r[2]||''}</td></tr>`).join('')}</tbody></table></div>`:''}
   </div></div></div>`);}

 // TRENDS + collection by decade
 const trS=sec('Trends'),funS=sec('Fun');const tr=table(trS),dec=table(funS);
 if(tr||dec){rendered.add(trS).add(funS);let trows='';
  if(tr)tr.rows.forEach(r=>{const dd=r[1]||'';const cl=dd.includes('↑')?'up':dd.includes('↓')?'down':'flat';
   trows+=`<tr><td>${md(r[0])}</td><td class=${cl}>${esc(dd)}</td><td class=mono>${esc(r[2]||'')}</td></tr>`;});
  let decbars='';if(dec){const mx=Math.max(...dec.rows.map(r=>parseInt(r[1])||0));
   dec.rows.forEach(r=>{const n=parseInt(r[1])||0;decbars+=`<div class=tank><div class=top><span class=nm>${esc(r[0])}</span><span class=sz>${n}</span></div><div class=bar><i style="width:${mx?n/mx*100:0}%"></i></div></div>`;});}
  const pick=(texts(funS).find(t=>/tonight/i.test(t))||'');
  const notes=(texts(funS).find(t=>/vault:/i.test(t))||'').match(/\*\*(\d+)\s*notes\*\*/);
  H.push(`<div class="grid g2" style="margin-top:14px">
   <div class=panel><div class=in><div class=phd><div class=tk></div><h3>Growth Trends</h3></div><div class=tw><table><thead><tr><th>Folder</th><th>Dir</th><th>Change</th></tr></thead><tbody>${trows}</tbody></table></div></div></div>
   <div class=panel><div class=in><div class=phd><div class=tk></div><h3>Collection · by decade</h3>${notes?`<div class="tag cy">${notes[1]} notes</div>`:''}</div>${decbars}
    ${pick?`<div class=alert info style="margin-top:10px"><div class=big>▶</div><div class=tx>${md(pick.replace(/^🎬\s*/,''))}</div></div>`:''}</div></div></div>`);}

 // any unrecognised sections -> generic tables so nothing is lost
 const leftover=S.filter(s=>!rendered.has(s)).map(s=>{
  const t=table(s);
  const body=t?`<div class=tw><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
   :texts(s).map(x=>`<p style="color:var(--dim);font-size:12.5px;margin:4px 0">${md(x)}</p>`).join('');
  return panel(s.title,'','',body);
 }).join('');
 if(leftover)H.push(`<div class="grid g2" style="margin-top:14px">${leftover}</div>`);
 return H.join('');
}

// ---------------- movies ----------------
function moviesZone(m){
 if(!m||!m.ok)return zone('Movies','')+'<div class=miss>movies module: no data (check [movies] config)</div>';
 const rows=(m.movies||[]).map(mv=>`<div class=mv><span class="st ${mv.watched?'w':'u'}"></span>
   <span class=nm>${esc(mv.name)}</span>${mv.how?`<span class=how>${mv.how}</span>`:''}
   <span class=sz>${human(mv.size)}</span>
   ${mv.watched?'':`<button onclick="markW(this,'${esc(mv.name).replace(/'/g,"\\'")}')">✓ watched</button>`}</div>`).join('');
 return zone('Movies','watched: '+m.watched+'/'+m.total)
  +panel('Backlog',human(m.backlog)+' unwatched','',
   `<div style="max-height:420px;overflow:auto">${rows}</div>`);
}
async function markW(btn,title){
 btn.textContent='…';
 try{await fetch('/movies/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});}catch(e){}
 tickMovies();
}

// ---------------- rail ----------------
function rail(d){
 const g=(d.gpus||[])[0]||{};const disk=(d.disks||[])[0]||{};const b=d.battery||{};const m=d.memory||{};
 let cells=[
  ['CPU Core',(d.cpu?.temp??'—'),'°C','amber'],
  g.name?[g.name.split(' ').slice(-1)[0]||'GPU',(g.temp??'—'),'°C'+(g.watt!=null?' · '+g.watt+'W':''),'cy']:null,
  disk.free!=null?['Disk Free',human(disk.free),'','tx']:null,
  m.pct!=null?['Memory',m.pct,'%','amber']:null,
  d.battery?['Battery',(b.pct??'—'),'%'+(b.limit?' · cap '+b.limit:''),'tx']:null,
 ].filter(Boolean);
 $('#rail').innerHTML=cells.map(([l,v,u,c])=>`<div><div class=lbl>${l}</div><div class="val ${c=='cy'?'cy':c=='tx'?'tx':''}">${v}<small>${u}</small></div></div>`).join('');
}

// ---------------- render orchestration ----------------
function render(boot){
 CFG=boot.cfg||CFG;
 const d=boot.data||{};window._d=d;
 $('#host').textContent='// '+(d.host||'')+' command deck';
 $('#gov').textContent=d.cpu?.governor||'—';
 if(d.profile){$('#profchip').style.display='';$('#prof').textContent=d.profile;}
 const on=d.net?.vpn;$('#vpnd').className='dot '+(on?'on':'off');$('#vpn').textContent=on?'VPN ON':'NET';
 rail(d);
 let html=telemetry(d);
 if(boot.integrity)html+=checklist('System Integrity','persistence self-check',boot.integrity);
 if(boot.advisories)html+=checklist('Health Advisories','signals',boot.advisories);
 if(CFG.panels.vault)html+=vaultZone(boot.vault);
 if(CFG.panels.movies)html+=moviesZone(boot.movies);
 $('#zones').innerHTML=html;
 $('#cfgline').textContent=Object.entries(CFG.panels).filter(([,v])=>v).map(([k])=>k).join(' · ');
}
async function tick(){try{const b=await(await fetch('/snapshot')).json();render(b);}catch(e){}}
async function tickMovies(){if(!CFG.panels.movies)return;try{const m=await(await fetch('/movies')).json();
 // re-render just the movies zone by full snapshot for simplicity
 const b=await(await fetch('/snapshot')).json();render(b);}catch(e){}}
function clock(){$('#clock').textContent=new Date().toLocaleTimeString('en-GB');}
if(window.__BOOT__){try{render(window.__BOOT__)}catch(e){console.error(e)}}
clock();setInterval(tick,2000);setInterval(clock,1000);
</script></body></html>
